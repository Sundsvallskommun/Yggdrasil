services:

  db:
    image: mariadb:10.11
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Europe/Stockholm
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - ./config/db/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - db_data:/var/lib/mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"

  api-service-notifier:
    image: ghcr.io/sundsvallskommun/api-service-notifier:1.0
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      db:
        condition: service_healthy
      api-service-sms-sender:
        condition: service_started
#      api-service-teams-sender:
#        condition: service_started
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
    env_file: config/backend/.env-notifier
    volumes:
      - ./config/backend/application-notifier.yml:/app/config/application.yml
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api-service-webappusers:
    image: ghcr.io/sundsvallskommun/api-service-webapp-users:1.0
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
    env_file: config/backend/.env-webappusers
    volumes:
      - ./config/backend/application-webappusers.yml:/app/config/application.yml
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api-service-sms-sender:
    image: ghcr.io/sundsvallskommun/api-service-sms-sender:2.0
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
    env_file: config/backend/.env-smssender
    volumes:
      - ./config/backend/application-smssender.yml:/app/config/application.yml
    restart: unless-stopped

# TODO: Reenable if/when teams-sender is functional
#  api-service-teams-sender:
#    image: ghcr.io/sundsvallskommun/api-service-teams-sender:latest
#    environment:
#      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
#    env_file: config/backend/.env-teams-sender
#    volumes:
#      - ./config/backend/application-teams-sender.yml:/app/config/application.yml
#    restart: unless-stopped

  csv-filereader:
    image: ghcr.io/sundsvallskommun/api-service-csv-filereader:1.0
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      db:
        condition: service_healthy
      api-service-notifier:
        condition: service_healthy
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
    env_file: config/backend/.env-csv-filereader
    volumes:
      - ./config/backend/application-csv-filereader.yml:/app/config/application.yml
      - csv_incoming:/data/incoming
      - csv_processed:/data/processed
      - csv_failed:/data/failed
      - csv_temp:/data/temp
    restart: unless-stopped

  web-app-nidhogg:
    image: ghcr.io/sundsvallskommun/web-app-nidhogg:0.2.0
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Workaround: image is published amd64-only; emulated on arm64 hosts.
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
      api-service-notifier:
        condition: service_healthy
      api-service-webappusers:
        condition: service_healthy
#      api-service-teams-sender:
#        condition: service_started
    env_file:
      - ${SECRETS_FILE:-config/secret.env}
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - yggdrasil
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - web-app-nidhogg
    # Traffic routed through public-proxy with TLS (notifyer.sundsvall.se)
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    cpus: 1
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  watchtower:
    image: nickfedor/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Auto-update at 03:00 every night
      WATCHTOWER_SCHEDULE: "0 0 3 * * *"
      # Only update containers with enable=true label
      WATCHTOWER_LABEL_ENABLE: "true"
      # Restart containers after pulling new images
      WATCHTOWER_LIFECYCLE_HOOKS: "true"
      # Check stopped containers (e.g. nidhogg) but don't start them
      WATCHTOWER_INCLUDE_STOPPED: "true"
      WATCHTOWER_REVIVE_STOPPED: "false"
      # Clean up old images after update
      WATCHTOWER_CLEANUP: "true"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    mem_limit: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db_data:
  csv_incoming:
  csv_processed:
  csv_failed:
  csv_temp:
networks:
  yggdrasil:
    name: yggdrasil