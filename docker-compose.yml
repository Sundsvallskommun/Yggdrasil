services:

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Europe/Stockholm
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - ./config/db/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - db_data:/var/lib/mysql
    restart: unless-stopped

  api-service-notifier:
    image: ghcr.io/sundsvallskommun/api-service-notifier:1.0
    depends_on:
      db:
        condition: service_healthy
      api-service-sms-sender:
        condition: service_started
#      api-service-teams-sender:
#        condition: service_started
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
    env_file: config/backend/.env-notifier
    volumes:
      - ./config/backend/application-notifier.yml:/app/config/application.yml
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api-service-webappusers:
    image: ghcr.io/sundsvallskommun/api-service-webapp-users:1.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
    env_file: config/backend/.env-webappusers
    volumes:
      - ./config/backend/application-webappusers.yml:/app/config/application.yml
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api-service-sms-sender:
    image: ghcr.io/sundsvallskommun/api-service-sms-sender:2.0
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
    env_file: config/backend/.env-smssender
    volumes:
      - ./config/backend/application-smssender.yml:/app/config/application.yml
    restart: unless-stopped

#  api-service-teams-sender:
#    image: ghcr.io/sundsvallskommun/api-service-teams-sender:latest
#    environment:
#      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
#    env_file: config/backend/.env-teams-sender
#    volumes:
#      - ./config/backend/application-teams-sender.yml:/app/config/application.yml
#    restart: unless-stopped

  csv-filereader:
    image: ghcr.io/sundsvallskommun/api-service-csv-filereader:1.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
    env_file: config/backend/.env-csv-filereader
    volumes:
      - ./config/backend/application-csv-filereader.yml:/app/config/application.yml
      - csv_incoming:/data/incoming
      - csv_processed:/data/processed
      - csv_failed:/data/failed
      - csv_temp:/data/temp
    restart: unless-stopped

  web-app-nidhogg:
    image: ghcr.io/sundsvallskommun/web-app-nidhogg:0.2.0
    # Workaround: image is published amd64-only; emulated on arm64 hosts.
    # Remove once web-app-nidhogg is built multi-arch (linux/amd64,linux/arm64).
    platform: linux/amd64
    depends_on:
      api-service-notifier:
        condition: service_healthy
      api-service-webappusers:
        condition: service_healthy
#      api-service-teams-sender:
#        condition: service_started
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db_data:
  csv_incoming:
  csv_processed:
  csv_failed:
  csv_temp: