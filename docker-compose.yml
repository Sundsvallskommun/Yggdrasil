services:

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Europe/Stockholm
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - ./config/db/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - db_data:/var/lib/mysql
    restart: unless-stopped

  # Merged service: messaging + users + CSV import (formerly api-service-webappusers + csv-filereader)
  api-service-notifier:
    image: ghcr.io/sundsvallskommun/api-service-notifier:2.0
    depends_on:
      db:
        condition: service_healthy
      api-service-sms-sender:
        condition: service_started
      api-service-teams-sender:
        condition: service_started
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
    volumes:
      - ./config/backend/application-notifier.yml:/app/config/application.yml
      # CSV import drop folders (csvimport module)
      - /opt/apps/Yggdrasil/csv/incoming:/data/incoming
      - /opt/apps/Yggdrasil/csv/processed:/data/processed
      - /opt/apps/Yggdrasil/csv/failed:/data/failed
      - /opt/apps/Yggdrasil/csv/temp:/data/temp
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      default:
        aliases:
          # nidhogg image (standalone Next.js) has the old proxy targets baked in
          # at build time; alias the merged-away hostnames to this container.
          - api-service-webappusers
          - api-service-teams-sender
    restart: unless-stopped

  api-service-sms-sender:
    image: ghcr.io/sundsvallskommun/api-service-sms-sender:2.0
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
    volumes:
      - ./config/backend/application-smssender.yml:/app/config/application.yml
    restart: unless-stopped

  api-service-teams-sender:
    image: ghcr.io/sundsvallskommun/api-service-teams-sender:1.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
    volumes:
      - ./config/backend/application-teams-sender.yml:/app/config/application.yml
    restart: unless-stopped

  web-app-nidhogg:
    image: ghcr.io/sundsvallskommun/web-app-nidhogg:0.2.0
    # Workaround: image is published amd64-only; emulated on arm64 hosts.
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
      api-service-notifier:
        condition: service_healthy
    # Note: API_PROXY_TARGET_* env vars have no effect at runtime — the Next.js
    # standalone build bakes rewrite targets in at image build time. Routing to
    # the merged notifier is handled via network aliases on api-service-notifier.
    env_file:
      - ${SECRETS_FILE:-config/secret.env}
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - web-app-nidhogg
    # Traffic routed through public-proxy with TLS (notifyer.sundsvall.se)
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    cpus: 1
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db_data:
networks:
  default:
    name: yggdrasil
    # Skip ownership, just attach to the network
    external: true