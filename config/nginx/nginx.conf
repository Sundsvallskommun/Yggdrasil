limit_req_zone $binary_remote_addr zone=nidhogg_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=nidhogg_api:10m rate=5r/s;
limit_req_status 429;

# Use Docker's embedded DNS with a short TTL so container IP changes are picked
# up automatically without requiring an nginx reload.
resolver 127.0.0.11 valid=10s;

server {
    # TLS terminates at the upstream public-proxy; this server only sees internal HTTP.
    listen 80;

    # Rate limiting
    limit_req zone=nidhogg_general burst=20 nodelay;

    # Limit request body size (mitigates large deserialization payloads)
    client_max_body_size 1m;

    # Block direct access to Next.js server action internals
    location ~* ^/_next/data/.*\.json$ {
        set $upstream_nidhogg http://web-app-nidhogg:3000;
        limit_req zone=nidhogg_api burst=10 nodelay;
        proxy_pass $upstream_nidhogg;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cookie_flags ~ nosecure;
    }

    location / {
        set $upstream_nidhogg http://web-app-nidhogg:3000;
        proxy_pass $upstream_nidhogg;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Strip Secure flag so cookies work over plain HTTP
        proxy_cookie_flags ~ nosecure;
    }
}