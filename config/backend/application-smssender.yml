# Mock/local-dev values, self-contained (no .env files). In production these are
# overridden by the real application.yml supplied from the GitLab config repo.
logging:
  level:
    root: INFO

spring:
  application:
    name: api-sms-sender

scheduler:
  linkmobility:
    health:
      cron: "-"

provider:
  telia:
    base-url: http://wiremock:8080
    enabled: true
    priority: 1
    flash-capable: true
    oauth2:
      token-url: http://wiremock:8080/token
      client-id: mock-client-id
      client-secret: mock-client-secret
  linkmobility:
    base-url: http://wiremock:8080
    enabled: true
    priority: 2
    flash-capable: true
    platform-id: mock-platform-id
    platform-partner-id: mock-partner-id
    basicauth:
      username: mock-username
      password: mock-password

openapi:
  name: api-service-sms-sender
  title: SmsSender
  version: '@project.version@'
